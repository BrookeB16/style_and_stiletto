<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style & Stiletto — Responses</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f7f3ee;
    --warm-white: #faf8f5;
    --charcoal: #1e1c1a;
    --ink: #2e2b28;
    --taupe: #9c8f83;
    --dusty-rose: #c4a89a;
    --gold: #b8975a;
    --border: #e0d8d0;
    --section-bg: #f0ebe4;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--cream);
    color: var(--ink);
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    min-height: 100vh;
  }

  header {
    background: var(--charcoal);
    color: var(--cream);
    padding: 32px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
  }

  .header-left h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px;
    font-weight: 300;
    letter-spacing: 0.08em;
  }

  .header-left h1 em { color: var(--gold); font-style: italic; }

  .header-left p {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(247,243,238,0.5);
    margin-top: 4px;
  }

  .login-form {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  .login-form input {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 2px;
    padding: 10px 16px;
    font-family: 'Jost', sans-serif;
    font-size: 13px;
    color: var(--cream);
    outline: none;
    width: 240px;
  }

  .login-form input::placeholder { color: rgba(247,243,238,0.35); }
  .login-form input:focus { border-color: var(--gold); }

  .btn {
    background: var(--gold);
    color: var(--charcoal);
    border: none;
    padding: 10px 24px;
    font-family: 'Jost', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 2px;
    transition: opacity 0.2s;
  }

  .btn:hover { opacity: 0.85; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-outline {
    background: transparent;
    color: var(--gold);
    border: 1px solid var(--gold);
  }

  .main { max-width: 1100px; margin: 0 auto; padding: 40px 24px; }

  /* Stats bar */
  .stats-bar {
    display: flex;
    gap: 24px;
    margin-bottom: 36px;
    flex-wrap: wrap;
  }

  .stat-card {
    background: var(--warm-white);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 20px 28px;
    flex: 1;
    min-width: 140px;
  }

  .stat-card .num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 36px;
    font-weight: 300;
    color: var(--gold);
    line-height: 1;
  }

  .stat-card .label {
    font-size: 10.5px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--taupe);
    margin-top: 6px;
  }

  /* Response cards */
  .response-grid {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .response-card {
    background: var(--warm-white);
    border: 1px solid var(--border);
    border-radius: 2px;
    overflow: hidden;
    transition: border-color 0.2s;
  }

  .response-card:hover { border-color: var(--taupe); }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 24px;
    cursor: pointer;
    gap: 16px;
  }

  .card-header-left {
    display: flex;
    align-items: center;
    gap: 16px;
    flex: 1;
    min-width: 0;
  }

  .avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--charcoal);
    color: var(--gold);
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .card-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    font-weight: 400;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-meta {
    font-size: 11.5px;
    color: var(--taupe);
    margin-top: 2px;
  }

  .card-tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    flex: 1;
    justify-content: flex-end;
  }

  .tag {
    padding: 4px 10px;
    background: var(--section-bg);
    border: 1px solid var(--border);
    border-radius: 2px;
    font-size: 11px;
    color: var(--taupe);
    white-space: nowrap;
  }

  .tag.gold { background: rgba(184,151,90,0.12); border-color: rgba(184,151,90,0.3); color: var(--gold); }

  .chevron {
    font-size: 12px;
    color: var(--taupe);
    transition: transform 0.2s;
    flex-shrink: 0;
  }

  .response-card.open .chevron { transform: rotate(180deg); }

  /* Expanded detail */
  .card-body {
    display: none;
    padding: 0 24px 24px;
    border-top: 1px solid var(--border);
    animation: fadeDown 0.2s ease;
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .response-card.open .card-body { display: block; }

  .detail-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
    margin-top: 20px;
  }

  .detail-section { }

  .detail-section-title {
    font-size: 10px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 12px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  .detail-row {
    display: flex;
    flex-direction: column;
    margin-bottom: 10px;
  }

  .detail-key {
    font-size: 10.5px;
    color: var(--taupe);
    letter-spacing: 0.3px;
    margin-bottom: 2px;
  }

  .detail-val {
    font-size: 13px;
    color: var(--ink);
    line-height: 1.5;
  }

  .detail-val.empty { color: var(--border); font-style: italic; }

  /* Empty / loading states */
  .state-msg {
    text-align: center;
    padding: 80px 24px;
    color: var(--taupe);
  }

  .state-msg .icon {
    font-family: 'Cormorant Garamond', serif;
    font-size: 48px;
    color: var(--border);
    margin-bottom: 16px;
  }

  .state-msg p { font-size: 13px; line-height: 1.7; }

  .error-banner {
    background: rgba(196,168,154,0.15);
    border: 1px solid var(--dusty-rose);
    border-radius: 2px;
    padding: 14px 18px;
    font-size: 12.5px;
    color: #8a5a4a;
    margin-bottom: 24px;
  }

  @media (max-width: 600px) {
    header { padding: 24px 20px; }
    .main { padding: 24px 16px; }
    .card-tags { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>Style <em>&</em> Stiletto</h1>
    <p>Client Responses Dashboard</p>
  </div>
  <div class="login-form" id="loginArea">
    <input type="password" id="tokenInput" placeholder="Admin token" onkeydown="if(event.key==='Enter') loadResponses()">
    <button class="btn" onclick="loadResponses()">View Responses</button>
  </div>
  <div id="loggedInArea" style="display:none; align-items:center; gap:12px;">
    <span style="font-size:12px; color:rgba(247,243,238,0.5);" id="responseCount"></span>
    <button class="btn btn-outline" onclick="logout()">Sign Out</button>
  </div>
</header>

<div class="main">
  <div id="errorBanner" class="error-banner" style="display:none;"></div>

  <div id="loadingState" class="state-msg" style="display:none;">
    <div class="icon">✦</div>
    <p>Loading responses…</p>
  </div>

  <div id="emptyState" class="state-msg" style="display:none;">
    <div class="icon">✦</div>
    <p>No responses yet.<br>Share your intake form link to get started.</p>
  </div>

  <div id="promptState" class="state-msg">
    <div class="icon">✦</div>
    <p>Enter your admin token above<br>to view client responses.</p>
  </div>

  <div id="statsBar" class="stats-bar" style="display:none;">
    <div class="stat-card">
      <div class="num" id="statTotal">0</div>
      <div class="label">Total Responses</div>
    </div>
    <div class="stat-card">
      <div class="num" id="statThisWeek">0</div>
      <div class="label">This Week</div>
    </div>
    <div class="stat-card">
      <div class="num" id="statTopAesthetic">—</div>
      <div class="label">Top Aesthetic</div>
    </div>
    <div class="stat-card">
      <div class="num" id="statAvgBudget">—</div>
      <div class="label">Avg. Everyday Budget</div>
    </div>
  </div>

  <div class="response-grid" id="responseGrid"></div>
</div>

<script>
  let allResponses = [];

  function logout() {
    allResponses = [];
    document.getElementById('responseGrid').innerHTML = '';
    document.getElementById('statsBar').style.display = 'none';
    document.getElementById('loggedInArea').style.display = 'none';
    document.getElementById('loginArea').style.display = 'flex';
    document.getElementById('promptState').style.display = 'block';
    document.getElementById('tokenInput').value = '';
  }

  async function loadResponses() {
    const token = document.getElementById('tokenInput').value.trim();
    if (!token) return;

    const errEl = document.getElementById('errorBanner');
    errEl.style.display = 'none';

    document.getElementById('promptState').style.display = 'none';
    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('loadingState').style.display = 'block';

    try {
      const res = await fetch('/api/responses', {
        headers: { 'Authorization': `Bearer ${token}` }
      });

      const data = await res.json();
      document.getElementById('loadingState').style.display = 'none';

      if (!res.ok) {
        errEl.textContent = data.error || 'Failed to load responses.';
        errEl.style.display = 'block';
        document.getElementById('promptState').style.display = 'block';
        return;
      }

      allResponses = data.responses || [];
      document.getElementById('loginArea').style.display = 'none';
      document.getElementById('loggedInArea').style.display = 'flex';
      document.getElementById('responseCount').textContent = `${allResponses.length} response${allResponses.length !== 1 ? 's' : ''}`;

      if (allResponses.length === 0) {
        document.getElementById('emptyState').style.display = 'block';
        return;
      }

      renderStats();
      renderResponses();

    } catch (err) {
      document.getElementById('loadingState').style.display = 'none';
      errEl.textContent = 'Network error. Check your connection and try again.';
      errEl.style.display = 'block';
      document.getElementById('promptState').style.display = 'block';
    }
  }

  function renderStats() {
    const statsBar = document.getElementById('statsBar');
    statsBar.style.display = 'flex';

    document.getElementById('statTotal').textContent = allResponses.length;

    const weekAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000);
    const thisWeek = allResponses.filter(r => new Date(r.submitted_at) > weekAgo).length;
    document.getElementById('statThisWeek').textContent = thisWeek;

    const aestheticCounts = {};
    allResponses.forEach(r => {
      if (r.aesthetic_words) {
        r.aesthetic_words.split(',').forEach(a => {
          const k = a.trim();
          if (k) aestheticCounts[k] = (aestheticCounts[k] || 0) + 1;
        });
      }
    });
    const topAesthetic = Object.entries(aestheticCounts).sort((a,b) => b[1]-a[1])[0];
    document.getElementById('statTopAesthetic').textContent = topAesthetic ? topAesthetic[0].split(' ')[0] : '—';

    const budgets = allResponses.map(r => parseInt(r.budget_everyday)).filter(n => !isNaN(n));
    const avgBudget = budgets.length ? Math.round(budgets.reduce((a,b) => a+b, 0) / budgets.length) : null;
    document.getElementById('statAvgBudget').textContent = avgBudget ? '$' + avgBudget : '—';
  }

  function renderResponses() {
    const grid = document.getElementById('responseGrid');
    grid.innerHTML = '';

    allResponses.forEach((r, i) => {
      const initials = ((r.first_name?.[0] || '') + (r.last_name?.[0] || '')).toUpperCase() || '?';
      const fullName = [r.first_name, r.last_name].filter(Boolean).join(' ') || 'Anonymous';
      const date = r.submitted_at ? new Date(r.submitted_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '';

      const tags = [
        r.age_range,
        r.location,
        r.timeline,
      ].filter(Boolean);

      const aestheticTag = r.aesthetic_words?.split(',')[0]?.trim();

      const card = document.createElement('div');
      card.className = 'response-card';
      card.innerHTML = `
        <div class="card-header" onclick="toggleCard(this)">
          <div class="card-header-left">
            <div class="avatar">${initials}</div>
            <div>
              <div class="card-name">${esc(fullName)}</div>
              <div class="card-meta">${esc(r.email || '')}${date ? ' · ' + date : ''}</div>
            </div>
          </div>
          <div class="card-tags">
            ${tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}
            ${aestheticTag ? `<span class="tag gold">${esc(aestheticTag)}</span>` : ''}
          </div>
          <span class="chevron">▼</span>
        </div>
        <div class="card-body">
          <div class="detail-grid">
            ${section('About', [
              ['Name', fullName],
              ['Email', r.email],
              ['Age Range', r.age_range],
              ['Location', r.location],
            ])}
            ${section('Budget', [
              ['Everyday Budget', r.budget_everyday ? '$' + r.budget_everyday : null],
              ['Investment Willingness', r.investment_pieces],
              ['Max Investment Piece', r.budget_investment ? '$' + r.budget_investment : null],
              ['Shopping Preference', r.shopping_preference],
            ])}
            ${section('Wardrobe', [
              ['Shopping For', r.shopping_for],
              ['Dress Code', r.office_dress_code],
              ['Work Notes', r.work_environment_notes],
              ['Current Wardrobe', r.current_wardrobe],
              ['Shoes', r.shoe_interest],
              ['Accessories', r.accessory_interest],
            ])}
            ${section('Aesthetic', [
              ['Color Preference', r.color_preference],
              ['Colors Loved', r.colors_loved],
              ['Colors Avoided', r.colors_avoided],
              ['Patterns', r.pattern_preference],
              ['Aesthetic Words', r.aesthetic_words],
              ['Style Inspiration', r.style_inspiration],
            ])}
            ${section('Body & Fit', [
              ['Body Shape', r.body_shape],
              ['Tops / Bottoms', [r.size_tops, r.size_bottoms].filter(Boolean).join(' / ') || null],
              ['Shoe Size', r.shoe_size],
              ['Height', r.height],
              ['Highlight', r.areas_highlight],
              ['Minimize', r.areas_minimize],
              ['Fit Preference', r.fit_preference],
            ])}
            ${section('Lifestyle', [
              ['Daily Activity', r.daily_activity],
              ['Comfort (1–5)', r.comfort_importance],
              ['Fabrics Loved', r.fabrics_loved],
              ['Fabrics Avoided', r.fabrics_avoided],
              ['Sustainability', r.sustainability],
              ['Special Considerations', r.special_considerations],
            ])}
            ${section('Service', [
              ['Delivery Style', r.delivery_preference],
              ['Brands Loved', r.brands_loved],
              ['Brands Avoided', r.brands_avoided],
              ['Involvement', r.involvement_level],
              ['Timeline', r.timeline],
            ])}
            ${section('Notes', [
              ['Biggest Frustration', r.styling_frustration],
              ['Success Looks Like', r.success_looks_like],
              ['Anything Else', r.anything_else],
            ])}
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  function section(title, rows) {
    const rowsHtml = rows.map(([k, v]) => `
      <div class="detail-row">
        <span class="detail-key">${k}</span>
        <span class="detail-val ${!v ? 'empty' : ''}">${v ? esc(v) : '—'}</span>
      </div>
    `).join('');
    return `
      <div class="detail-section">
        <div class="detail-section-title">${title}</div>
        ${rowsHtml}
      </div>
    `;
  }

  function toggleCard(header) {
    const card = header.closest('.response-card');
    card.classList.toggle('open');
  }

  function esc(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>

</body>
</html>

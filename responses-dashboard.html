<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style & Stiletto — Responses</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    --cream: #f7f3ee;
    --warm-white: #faf8f5;
    --charcoal: #1e1c1a;
    --ink: #2e2b28;
    --taupe: #9c8f83;
    --dusty-rose: #c4a89a;
    --gold: #b8975a;
    --border: #e0d8d0;
    --section-bg: #f0ebe4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--cream); color: var(--ink); font-family: 'Jost', sans-serif; font-weight: 300; min-height: 100vh; }
  header { background: var(--charcoal); color: var(--cream); padding: 32px 40px; display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
  .header-left h1 { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 300; letter-spacing: 0.08em; }
  .header-left h1 em { color: var(--gold); font-style: italic; }
  .header-left p { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: rgba(247,243,238,0.5); margin-top: 4px; }
  .login-form { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .login-form input { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 2px; padding: 10px 16px; font-family: 'Jost', sans-serif; font-size: 13px; color: var(--cream); outline: none; width: 240px; }
  .login-form input::placeholder { color: rgba(247,243,238,0.35); }
  .login-form input:focus { border-color: var(--gold); }
  .btn { background: var(--gold); color: var(--charcoal); border: none; padding: 10px 24px; font-family: 'Jost', sans-serif; font-size: 11px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: opacity 0.2s; }
  .btn:hover { opacity: 0.85; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-outline { background: transparent; color: var(--gold); border: 1px solid var(--gold); }
  .btn-sm { padding: 7px 16px; font-size: 10px; letter-spacing: 1.5px; }
  .btn-ghost { background: transparent; color: var(--taupe); border: 1px solid var(--border); padding: 7px 16px; font-family: 'Jost', sans-serif; font-size: 10px; font-weight: 400; letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: all 0.15s; }
  .btn-ghost:hover { border-color: var(--taupe); color: var(--ink); }
  .main { max-width: 1100px; margin: 0 auto; padding: 40px 24px; }
  .stats-bar { display: flex; gap: 24px; margin-bottom: 36px; flex-wrap: wrap; }
  .stat-card { background: var(--warm-white); border: 1px solid var(--border); border-radius: 2px; padding: 20px 28px; flex: 1; min-width: 140px; }
  .stat-card .num { font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 300; color: var(--gold); line-height: 1; }
  .stat-card .label { font-size: 10.5px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--taupe); margin-top: 6px; }
  .response-grid { display: flex; flex-direction: column; gap: 16px; }
  .response-card { background: var(--warm-white); border: 1px solid var(--border); border-radius: 2px; overflow: hidden; transition: border-color 0.2s; }
  .response-card:hover { border-color: var(--taupe); }
  .card-header { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; cursor: pointer; gap: 16px; }
  .card-header-left { display: flex; align-items: center; gap: 16px; flex: 1; min-width: 0; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--charcoal); color: var(--gold); font-family: 'Cormorant Garamond', serif; font-size: 16px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .card-name { font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-meta { font-size: 11.5px; color: var(--taupe); margin-top: 2px; }
  .card-tags { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; justify-content: flex-end; }
  .tag { padding: 4px 10px; background: var(--section-bg); border: 1px solid var(--border); border-radius: 2px; font-size: 11px; color: var(--taupe); white-space: nowrap; }
  .tag.gold { background: rgba(184,151,90,0.12); border-color: rgba(184,151,90,0.3); color: var(--gold); }
  .chevron { font-size: 12px; color: var(--taupe); transition: transform 0.2s; flex-shrink: 0; }
  .response-card.open .chevron { transform: rotate(180deg); }
  .card-body { display: none; padding: 0 24px 24px; border-top: 1px solid var(--border); animation: fadeDown 0.2s ease; }
  @keyframes fadeDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
  .response-card.open .card-body { display: block; }
  .card-actions { display: flex; gap: 10px; padding: 16px 0; border-bottom: 1px solid var(--border); margin-bottom: 4px; flex-wrap: wrap; }
  .detail-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; margin-top: 20px; }
  .detail-section-title { font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--gold); margin-bottom: 12px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
  .detail-row { display: flex; flex-direction: column; margin-bottom: 10px; }
  .detail-key { font-size: 10.5px; color: var(--taupe); letter-spacing: 0.3px; margin-bottom: 2px; }
  .detail-val { font-size: 13px; color: var(--ink); line-height: 1.5; }
  .detail-val.empty { color: var(--border); font-style: italic; }
  .brief-panel { display: none; margin-top: 24px; border: 1px solid rgba(184,151,90,0.3); border-radius: 2px; background: linear-gradient(135deg, rgba(184,151,90,0.04), rgba(196,168,154,0.06)); overflow: hidden; }
  .brief-panel.visible { display: block; animation: fadeDown 0.3s ease; }
  .brief-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; background: rgba(184,151,90,0.08); border-bottom: 1px solid rgba(184,151,90,0.2); flex-wrap: wrap; gap: 10px; }
  .brief-title { font-family: 'Cormorant Garamond', serif; font-size: 16px; font-weight: 400; color: var(--gold); letter-spacing: 0.05em; }
  .brief-subtitle { font-size: 10.5px; color: var(--taupe); font-style: italic; margin-top: 1px; }
  .brief-body { padding: 20px; }
  .brief-loading { display: flex; align-items: center; gap: 12px; padding: 24px 20px; color: var(--taupe); font-size: 13px; font-style: italic; }
  .spinner { width: 18px; height: 18px; border: 1.5px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .brief-section { margin-bottom: 24px; }
  .brief-section:last-child { margin-bottom: 0; }
  .brief-section-title { font-size: 9.5px; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .brief-section-title::after { content: ''; flex: 1; height: 1px; background: rgba(184,151,90,0.2); }
  .brief-text { font-size: 13px; line-height: 1.8; color: var(--ink); }
  .piece-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .piece-card { background: var(--warm-white); border: 1px solid var(--border); border-radius: 2px; padding: 12px 14px; }
  .piece-card .piece-category { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--dusty-rose); margin-bottom: 4px; }
  .piece-card .piece-name { font-size: 13px; font-weight: 400; color: var(--ink); line-height: 1.4; }
  .piece-card .piece-note { font-size: 11px; color: var(--taupe); margin-top: 4px; font-style: italic; line-height: 1.4; }
  .outfit-formula { background: var(--warm-white); border: 1px solid var(--border); border-radius: 2px; padding: 14px 16px; margin-bottom: 10px; display: flex; align-items: flex-start; gap: 12px; }
  .outfit-num { font-family: 'Cormorant Garamond', serif; font-size: 22px; color: var(--gold); font-style: italic; line-height: 1; min-width: 24px; margin-top: 2px; }
  .outfit-details { flex: 1; }
  .outfit-name { font-size: 13px; font-weight: 400; color: var(--ink); margin-bottom: 4px; }
  .outfit-pieces { font-size: 12px; color: var(--taupe); line-height: 1.6; }
  .outfit-occasion { display: inline-block; margin-top: 6px; padding: 2px 8px; background: rgba(184,151,90,0.1); border: 1px solid rgba(184,151,90,0.2); border-radius: 2px; font-size: 10px; color: var(--gold); letter-spacing: 0.5px; }
  .store-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .store-chip { padding: 6px 14px; background: var(--warm-white); border: 1px solid var(--border); border-radius: 2px; font-size: 12px; color: var(--ink); }
  .avoid-list { font-size: 13px; color: var(--taupe); line-height: 1.8; font-style: italic; }
  .state-msg { text-align: center; padding: 80px 24px; color: var(--taupe); }
  .state-msg .icon { font-family: 'Cormorant Garamond', serif; font-size: 48px; color: var(--border); margin-bottom: 16px; }
  .state-msg p { font-size: 13px; line-height: 1.7; }
  .error-banner { background: rgba(196,168,154,0.15); border: 1px solid var(--dusty-rose); border-radius: 2px; padding: 14px 18px; font-size: 12.5px; color: #8a5a4a; margin-bottom: 24px; }
  .brief-error { padding: 16px 20px; font-size: 12.5px; color: #8a5a4a; font-style: italic; }
  @media (max-width: 600px) { header { padding: 24px 20px; } .main { padding: 24px 16px; } .card-tags { display: none; } }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>Style <em>&</em> Stiletto</h1>
    <p>Client Responses Dashboard</p>
  </div>
  <div class="login-form" id="loginArea">
    <input type="password" id="tokenInput" placeholder="Admin token" onkeydown="if(event.key==='Enter') loadResponses()">
    <button class="btn" onclick="loadResponses()">View Responses</button>
  </div>
  <div id="loggedInArea" style="display:none; align-items:center; gap:12px;">
    <span style="font-size:12px; color:rgba(247,243,238,0.5);" id="responseCount"></span>
    <button class="btn btn-outline" onclick="logout()">Sign Out</button>
  </div>
</header>

<div class="main">
  <div id="errorBanner" class="error-banner" style="display:none;"></div>
  <div id="loadingState" class="state-msg" style="display:none;"><div class="icon">✦</div><p>Loading responses…</p></div>
  <div id="emptyState" class="state-msg" style="display:none;"><div class="icon">✦</div><p>No responses yet.<br>Share your intake form link to get started.</p></div>
  <div id="promptState" class="state-msg"><div class="icon">✦</div><p>Enter your admin token above<br>to view client responses.</p></div>
  <div id="statsBar" class="stats-bar" style="display:none;">
    <div class="stat-card"><div class="num" id="statTotal">0</div><div class="label">Total Responses</div></div>
    <div class="stat-card"><div class="num" id="statThisWeek">0</div><div class="label">This Week</div></div>
    <div class="stat-card"><div class="num" id="statTopAesthetic">—</div><div class="label">Top Aesthetic</div></div>
    <div class="stat-card"><div class="num" id="statAvgBudget">—</div><div class="label">Avg. Everyday Budget</div></div>
  </div>
  <div class="response-grid" id="responseGrid"></div>
</div>

<script>
  let allResponses = [];

  function logout() {
    allResponses = [];
    document.getElementById('responseGrid').innerHTML = '';
    document.getElementById('statsBar').style.display = 'none';
    document.getElementById('loggedInArea').style.display = 'none';
    document.getElementById('loginArea').style.display = 'flex';
    document.getElementById('promptState').style.display = 'block';
    document.getElementById('tokenInput').value = '';
  }

  async function loadResponses() {
    const token = document.getElementById('tokenInput').value.trim();
    if (!token) return;
    const errEl = document.getElementById('errorBanner');
    errEl.style.display = 'none';
    document.getElementById('promptState').style.display = 'none';
    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('loadingState').style.display = 'block';
    try {
      const res = await fetch('/api/responses', { headers: { 'Authorization': `Bearer ${token}` } });
      const data = await res.json();
      document.getElementById('loadingState').style.display = 'none';
      if (!res.ok) { errEl.textContent = data.error || 'Failed to load responses.'; errEl.style.display = 'block'; document.getElementById('promptState').style.display = 'block'; return; }
      allResponses = data.responses || [];
      document.getElementById('loginArea').style.display = 'none';
      document.getElementById('loggedInArea').style.display = 'flex';
      document.getElementById('responseCount').textContent = allResponses.length + ' response' + (allResponses.length !== 1 ? 's' : '');
      if (allResponses.length === 0) { document.getElementById('emptyState').style.display = 'block'; return; }
      renderStats(); renderResponses();
    } catch (err) {
      document.getElementById('loadingState').style.display = 'none';
      errEl.textContent = 'Network error. Check your connection and try again.';
      errEl.style.display = 'block';
      document.getElementById('promptState').style.display = 'block';
    }
  }

  function renderStats() {
    document.getElementById('statsBar').style.display = 'flex';
    document.getElementById('statTotal').textContent = allResponses.length;
    const weekAgo = new Date(Date.now() - 7*24*60*60*1000);
    document.getElementById('statThisWeek').textContent = allResponses.filter(r => new Date(r.submitted_at) > weekAgo).length;
    const ac = {};
    allResponses.forEach(r => { if (r.aesthetic_words) r.aesthetic_words.split(',').forEach(a => { const k=a.trim(); if(k) ac[k]=(ac[k]||0)+1; }); });
    const top = Object.entries(ac).sort((a,b)=>b[1]-a[1])[0];
    document.getElementById('statTopAesthetic').textContent = top ? top[0].split(' ')[0] : '—';
    const budgets = allResponses.map(r=>parseInt(r.budget_everyday)).filter(n=>!isNaN(n));
    document.getElementById('statAvgBudget').textContent = budgets.length ? '$'+Math.round(budgets.reduce((a,b)=>a+b,0)/budgets.length) : '—';
  }

  function renderResponses() {
    const grid = document.getElementById('responseGrid');
    grid.innerHTML = '';
    allResponses.forEach((r, i) => {
      const initials = ((r.first_name?.[0]||'')+(r.last_name?.[0]||'')).toUpperCase()||'?';
      const fullName = [r.first_name, r.last_name].filter(Boolean).join(' ') || 'Anonymous';
      const date = r.submitted_at ? new Date(r.submitted_at).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '';
      const tags = [r.age_range, r.location, r.timeline].filter(Boolean);
      const aestheticTag = r.aesthetic_words?.split(',')[0]?.trim();
      const card = document.createElement('div');
      card.className = 'response-card';
      card.dataset.idx = i;
      card.innerHTML = `
        <div class="card-header" onclick="toggleCard(this)">
          <div class="card-header-left">
            <div class="avatar">${esc(initials)}</div>
            <div>
              <div class="card-name">${esc(fullName)}</div>
              <div class="card-meta">${esc(r.email||'')}${date?' · '+date:''}</div>
            </div>
          </div>
          <div class="card-tags">
            ${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}
            ${aestheticTag?`<span class="tag gold">${esc(aestheticTag)}</span>`:''}
          </div>
          <span class="chevron">▼</span>
        </div>
        <div class="card-body">
          <div class="card-actions">
            <button class="btn btn-sm" onclick="generateBrief(${i}, this)">✦ Generate Style Brief</button>
            <button class="btn-ghost" onclick="exportBriefPDF(${i})" id="exportBtn-${i}" style="display:none;">↓ Export PDF</button>
          </div>
          <div class="brief-panel" id="brief-${i}"></div>
          <div class="detail-grid">
            ${section('About',[['Name',fullName],['Email',r.email],['Age Range',r.age_range],['Location',r.location]])}
            ${section('Budget',[['Everyday Budget',r.budget_everyday?'$'+r.budget_everyday:null],['Investment Willingness',r.investment_pieces],['Max Investment Piece',r.budget_investment?'$'+r.budget_investment:null],['Shopping Preference',r.shopping_preference]])}
            ${section('Wardrobe',[['Shopping For',r.shopping_for],['Dress Code',r.office_dress_code],['Work Notes',r.work_environment_notes],['Current Wardrobe',r.current_wardrobe],['Shoes',r.shoe_interest],['Accessories',r.accessory_interest]])}
            ${section('Aesthetic',[['Color Preference',r.color_preference],['Colors Loved',r.colors_loved],['Colors Avoided',r.colors_avoided],['Patterns',r.pattern_preference],['Aesthetic Words',r.aesthetic_words],['Style Inspiration',r.style_inspiration]])}
            ${section('Body & Fit',[['Body Shape',r.body_shape],['Tops / Bottoms',[r.size_tops,r.size_bottoms].filter(Boolean).join(' / ')||null],['Shoe Size',r.shoe_size],['Height',r.height],['Highlight',r.areas_highlight],['Minimize',r.areas_minimize],['Fit Preference',r.fit_preference]])}
            ${section('Lifestyle',[['Daily Activity',r.daily_activity],['Comfort (1-5)',r.comfort_importance],['Fabrics Loved',r.fabrics_loved],['Fabrics Avoided',r.fabrics_avoided],['Sustainability',r.sustainability],['Special Considerations',r.special_considerations]])}
            ${section('Service',[['Delivery Style',r.delivery_preference],['Brands Loved',r.brands_loved],['Brands Avoided',r.brands_avoided],['Involvement',r.involvement_level],['Timeline',r.timeline]])}
            ${section('Notes',[['Biggest Frustration',r.styling_frustration],['Success Looks Like',r.success_looks_like],['Anything Else',r.anything_else]])}
          </div>
        </div>`;
      grid.appendChild(card);
    });
  }

  const briefCache = {};

  async function generateBrief(idx, btn) {
    const r = allResponses[idx];
    const panel = document.getElementById('brief-'+idx);
    const exportBtn = document.getElementById('exportBtn-'+idx);

    if (briefCache[idx]) {
      const isVisible = panel.classList.contains('visible');
      panel.classList.toggle('visible');
      exportBtn.style.display = isVisible ? 'none' : 'inline-block';
      btn.textContent = isVisible ? '✦ Generate Style Brief' : '✦ Hide Style Brief';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Generating…';
    panel.innerHTML = '<div class="brief-loading"><div class="spinner"></div> Crafting your client\'s style brief…</div>';
    panel.classList.add('visible');

    const prompt = `You are an expert personal stylist. Based on this client intake form, create a comprehensive styling brief.

CLIENT PROFILE:
Name: ${r.first_name} ${r.last_name||''}
Age Range: ${r.age_range||'Not specified'}
Location: ${r.location||'Not specified'}
Height: ${r.height||'Not specified'}
Body Shape: ${r.body_shape||'Not specified'}
Size Tops/Bottoms: ${r.size_tops||'?'} / ${r.size_bottoms||'?'}

STYLE: Aesthetic: ${r.aesthetic_words||'Not specified'} | Colors loved: ${r.colors_loved||'none'} | Colors avoided: ${r.colors_avoided||'none'} | Color preference: ${r.color_preference||'Not specified'} | Patterns: ${r.pattern_preference||'Not specified'} | Inspiration: ${r.style_inspiration||'none'}

BODY: Highlight: ${r.areas_highlight||'Not specified'} | Minimize: ${r.areas_minimize||'Not specified'} | Fit: ${r.fit_preference||'Not specified'} | Comfort (1-5): ${r.comfort_importance||'Not specified'}

LIFESTYLE: Shopping for: ${r.shopping_for||'Not specified'} | Activity: ${r.daily_activity||'Not specified'} | Fabrics loved: ${r.fabrics_loved||'Not specified'} | Fabrics avoided: ${r.fabrics_avoided||'Not specified'}

BUDGET: Everyday: $${r.budget_everyday||'?'} | Investment willingness: ${r.investment_pieces||'Not specified'} | Max investment: $${r.budget_investment||'?'} | Shopping style: ${r.shopping_preference||'Not specified'}

SERVICE: Brands loved: ${r.brands_loved||'Not specified'} | Brands avoided: ${r.brands_avoided||'Not specified'} | Delivery: ${r.delivery_preference||'Not specified'}

NOTES: Frustration: ${r.styling_frustration||'None'} | Success: ${r.success_looks_like||'Not specified'} | Other: ${r.anything_else||'None'}

Respond ONLY with a JSON object, no preamble, no markdown, no backticks:
{"stylePersonality":"2-3 sentence narrative","bodyNotes":"2-3 sentences on silhouettes, what to emphasize and minimize","colorStrategy":"1-2 sentences","keyPieces":[{"category":"Tops","name":"piece name","note":"why it works"},{"category":"Bottoms","name":"piece name","note":"why it works"},{"category":"Dresses","name":"piece name","note":"why it works"},{"category":"Outerwear","name":"piece name","note":"why it works"},{"category":"Shoes","name":"piece name","note":"why it works"},{"category":"Bags","name":"piece name","note":"why it works"},{"category":"Accessories","name":"piece name","note":"why it works"},{"category":"Workwear","name":"piece name","note":"why it works"}],"outfitFormulas":[{"name":"Formula name","pieces":"Wide-leg trouser + fitted ribbed tank + block heel mule + structured tote","occasion":"When to wear"},{"name":"Formula name","pieces":"specific pieces","occasion":"When to wear"},{"name":"Formula name","pieces":"specific pieces","occasion":"When to wear"},{"name":"Formula name","pieces":"specific pieces","occasion":"When to wear"},{"name":"Formula name","pieces":"specific pieces","occasion":"When to wear"}],"storesToShop":["store1","store2","store3","store4","store5","store6"],"thingsToAvoid":"2-3 sentences on cuts and styles to avoid and why","stylistNote":"A warm personal 2-sentence note about this client"}`;

    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model: 'claude-sonnet-4-20250514', max_tokens: 1000, messages: [{ role: 'user', content: prompt }] })
      });
      const data = await res.json();
      const raw = data.content?.find(b => b.type === 'text')?.text || '';
      const brief = JSON.parse(raw.replace(/```json|```/g,'').trim());
      briefCache[idx] = brief;
      renderBrief(idx, brief, r);
      btn.disabled = false;
      btn.textContent = '✦ Hide Style Brief';
      exportBtn.style.display = 'inline-block';
    } catch(err) {
      panel.innerHTML = '<div class="brief-error">Something went wrong generating the brief. Please try again.</div>';
      btn.disabled = false;
      btn.textContent = '✦ Generate Style Brief';
    }
  }

  function renderBrief(idx, b, r) {
    const fullName = [r.first_name, r.last_name].filter(Boolean).join(' ');
    const panel = document.getElementById('brief-'+idx);
    panel.innerHTML = `
      <div class="brief-header">
        <div>
          <div class="brief-title">✦ Style Brief — ${esc(fullName)}</div>
          <div class="brief-subtitle">AI-generated styling guide based on client intake</div>
        </div>
      </div>
      <div class="brief-body">
        <div class="brief-section"><div class="brief-section-title">Style Personality</div><div class="brief-text">${esc(b.stylePersonality)}</div></div>
        <div class="brief-section"><div class="brief-section-title">Body & Silhouette Notes</div><div class="brief-text">${esc(b.bodyNotes)}</div></div>
        <div class="brief-section"><div class="brief-section-title">Color Strategy</div><div class="brief-text">${esc(b.colorStrategy)}</div></div>
        <div class="brief-section">
          <div class="brief-section-title">Key Pieces to Source</div>
          <div class="piece-grid">${b.keyPieces.map(p=>`<div class="piece-card"><div class="piece-category">${esc(p.category)}</div><div class="piece-name">${esc(p.name)}</div><div class="piece-note">${esc(p.note)}</div></div>`).join('')}</div>
        </div>
        <div class="brief-section">
          <div class="brief-section-title">Outfit Formulas</div>
          ${b.outfitFormulas.map((f,i)=>`<div class="outfit-formula"><div class="outfit-num">${i+1}</div><div class="outfit-details"><div class="outfit-name">${esc(f.name)}</div><div class="outfit-pieces">${esc(f.pieces)}</div><span class="outfit-occasion">${esc(f.occasion)}</span></div></div>`).join('')}
        </div>
        <div class="brief-section"><div class="brief-section-title">Stores to Shop</div><div class="store-list">${b.storesToShop.map(s=>`<div class="store-chip">${esc(s)}</div>`).join('')}</div></div>
        <div class="brief-section"><div class="brief-section-title">What to Avoid</div><div class="avoid-list">${esc(b.thingsToAvoid)}</div></div>
        <div class="brief-section"><div class="brief-section-title">Stylist Note</div><div class="brief-text" style="font-style:italic;color:var(--taupe);">${esc(b.stylistNote)}</div></div>
      </div>`;
  }

  function exportBriefPDF(idx) {
    const brief = briefCache[idx];
    const r = allResponses[idx];
    if (!brief) return;
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'pt', format: 'letter' });
    const fullName = [r.first_name, r.last_name].filter(Boolean).join(' ');
    const margin = 56, pageW = doc.internal.pageSize.getWidth(), contentW = pageW - margin * 2;
    let y = margin;

    function checkPage(needed=40) { if (y+needed > doc.internal.pageSize.getHeight()-margin) { doc.addPage(); y=margin; } }
    function addSectionTitle(title) {
      checkPage(40); doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(184,151,90);
      doc.text(title.toUpperCase(), margin, y); y+=6;
      doc.setDrawColor(184,151,90); doc.setLineWidth(0.5); doc.line(margin,y,pageW-margin,y); y+=14;
    }
    function addBodyText(text, color=[46,43,40]) {
      doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(...color);
      const lines = doc.splitTextToSize(text, contentW); checkPage(lines.length*14);
      doc.text(lines, margin, y); y+=lines.length*14+8;
    }

    doc.setFillColor(30,28,26); doc.rect(0,0,pageW,80,'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(22); doc.setTextColor(184,151,90); doc.text('STYLE & STILETTO', margin, 38);
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(200,190,180); doc.text('Style Brief — '+fullName, margin, 56);
    doc.setFontSize(9); doc.setTextColor(150,140,130); doc.text('Generated '+new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}), margin, 70);
    y = 110;

    addSectionTitle('Style Personality'); addBodyText(brief.stylePersonality);
    addSectionTitle('Body & Silhouette Notes'); addBodyText(brief.bodyNotes);
    addSectionTitle('Color Strategy'); addBodyText(brief.colorStrategy);
    addSectionTitle('Key Pieces to Source');
    brief.keyPieces.forEach(p => {
      checkPage(40);
      doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(196,168,154); doc.text(p.category.toUpperCase(), margin, y); y+=13;
      doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(46,43,40); doc.text(p.name, margin, y); y+=13;
      doc.setFont('helvetica','italic'); doc.setFontSize(9); doc.setTextColor(156,143,131);
      const nl = doc.splitTextToSize(p.note, contentW); doc.text(nl, margin, y); y+=nl.length*12+10;
    });
    addSectionTitle('Outfit Formulas');
    brief.outfitFormulas.forEach((f,i) => {
      checkPage(50);
      doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(46,43,40); doc.text((i+1)+'. '+f.name, margin, y); y+=14;
      doc.setFont('helvetica','normal'); doc.setFontSize(10);
      const pl = doc.splitTextToSize(f.pieces, contentW); doc.text(pl, margin, y); y+=pl.length*13;
      doc.setFont('helvetica','italic'); doc.setFontSize(9); doc.setTextColor(184,151,90); doc.text('For: '+f.occasion, margin, y); y+=18;
    });
    addSectionTitle('Stores to Shop'); addBodyText(brief.storesToShop.join('  ·  '));
    addSectionTitle('What to Avoid'); addBodyText(brief.thingsToAvoid, [156,143,131]);
    addSectionTitle('Stylist Note'); addBodyText(brief.stylistNote, [156,143,131]);
    doc.save('StyleBrief_'+fullName.replace(/\s+/g,'_')+'.pdf');
  }

  function section(title, rows) {
    return '<div class="detail-section"><div class="detail-section-title">'+title+'</div>'+
      rows.map(([k,v])=>'<div class="detail-row"><span class="detail-key">'+k+'</span><span class="detail-val'+(v?'':' empty')+'">'+(v?esc(v):'—')+'</span></div>').join('')+'</div>';
  }

  function toggleCard(header) { header.closest('.response-card').classList.toggle('open'); }

  function esc(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
</body>
</html>
